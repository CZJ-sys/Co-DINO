[project]
name = "co-dino"
version = "0.1.0"
description = "Directional neural operator with sparse expert communication"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3",
  "numpy>=1.23,<2",
  "h5py>=3.8",
  "PyYAML>=6.0",
  "matplotlib>=3.6,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
