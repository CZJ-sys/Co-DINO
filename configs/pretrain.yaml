num_workers: 8
lr: 0.0001
weight_decay: 0.000001
lr_scheduler: cosine
warmup_ratio: 0.03
max_grad_norm: 5.0
loss: relative_l1
loss_reduction: sample_mean
validation_trajectories: 120
test_trajectories: 240
max_num_time_steps: 20
