model_size: L
dataset: [NS-Gauss, NS-Sines, CE-RP, CE-CRP, CE-Gauss, CE-KH]
num_trajectories: 200
num_epochs: 50
num_input_frames: 1
just_velocities: false
train_time_step_size: 1
train_small_time_transition: true
